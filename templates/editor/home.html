{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Your Documents</h2>
    <a href="{% url 'document_create' %}" class="btn btn-success">+ New Document</a>
</div>

{% if documents %}
    <ul class="list-group">
        {% for doc in documents %}
        <li class="list-group-item d-flex justify-content-between align-items-center">
            <a href="{% url 'document_editor' doc.id %}">{{ doc.title }}</a>
            <small>Last updated: {{ doc.updated_at }}</small>
        </li>
        {% endfor %}
    </ul>
{% else %}
    <p>You have no documents yet. <a href="{% url 'document_create'%}">Create one now</a>.</p>
{% endif %}
{% endblock %}
